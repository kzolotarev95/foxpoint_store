services:
  postgres:
    image: postgres:16-alpine
    container_name: foxpoint-postgres
    environment:
      POSTGRES_DB: foxpoint
      POSTGRES_USER: foxpoint
      POSTGRES_PASSWORD: foxpoint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxpoint -d foxpoint"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: foxpoint-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://foxpoint:foxpoint@postgres:5432/foxpoint?schema=public
      API_HOST: 0.0.0.0
      API_PORT: 4000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: foxpoint-web
    depends_on:
      - api
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:

